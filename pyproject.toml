[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nettrace"
version = "0.1.0"
description = "Network Threat Hunting and Malware Traffic Investigation Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ayush Singh", email = "singhayush0919@gmail.com"}
]
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "scapy>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
nettrace = "pcap_analyzer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
